; llama.cpp router presets: the ONLY models the router may serve (allow-list).
; Section name = model id that LiteLLM uses (config/config.yaml -> openai/<id>).
; Paths are relative to the project root; start the router from there.

[Qwen3-4B-Q4_K_M]
model = models\Qwen3-4B-Q4_K_M.gguf
n-gpu-layers = 99
ctx-size = 8192
jinja = 1

[Qwen3-8B-Q4_K_M]
model = models\Qwen3-8B-Q4_K_M.gguf
n-gpu-layers = 99
ctx-size = 8192
jinja = 1
