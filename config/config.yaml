# Shared backend settings, reused by every alias below (YAML anchor)
x-qwen3-4b-backend: &qwen3_4b_backend
  model: openai/qwen3-4b
  api_base: http://host.docker.internal:8080/v1
  api_key: os.environ/LLAMACPP_API_KEY
  # Notional internal pricing (not a real cost) so budgets and spend tracking work
  input_cost_per_token: 0.000001    # $1 per 1M input tokens
  output_cost_per_token: 0.000004   # $4 per 1M output tokens

model_list:
  # LEGACY: remove once client, tests and keys use the aliases below
  - model_name: qwen3-4b
    litellm_params:
      <<: *qwen3_4b_backend

  # Quick answers: thinking off, Qwen's recommended non-thinking sampling
  - model_name: local-fast
    litellm_params:
      <<: *qwen3_4b_backend
      temperature: 0.7
      top_p: 0.8
      extra_body:
        top_k: 20
        min_p: 0
        chat_template_kwargs:
          enable_thinking: false

  # Step-by-step reasoning: slow and token-hungry; grant to keys deliberately
  - model_name: local-reasoning
    litellm_params:
      <<: *qwen3_4b_backend
      temperature: 0.6
      top_p: 0.95
      extra_body:
        top_k: 20
        min_p: 0
        chat_template_kwargs:
          enable_thinking: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true